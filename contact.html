<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrise Hotel - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Sunrise Hotel</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="contact-main">
    <h2>Contact Us</h2>

    <div class="contact-wrapper">

      <div class="details">
        <h3>Hotel Details</h3>
        <p><strong>Address:</strong> 12 Main Street, Your City</p>
        <p><strong>Phone:</strong> +263 77 000 0000</p>
        <p><strong>Email:</strong> info@sunrisehotel.example</p>
        <p><strong>Reception:</strong> Open 24 hours</p>
      </div>

      <form class="contact-form" action="#" method="post">
        <h3>Send Us a Message</h3>

        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Sunrise Hotel. All rights reserved.</p>
  </footer>

</body>
</html>
